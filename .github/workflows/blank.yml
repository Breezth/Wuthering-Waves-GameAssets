name: Deploy Assets to RainS3

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force_path:
        description: "强制重新转换并上传的文件路径；通常留空"
        required: false
        type: string

      full_rebuild:
        description: "重新转换并上传仓库中的全部文件"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 防止多个部署同时修改同一个对象。
# queue: max 会让后续部署排队，而不是丢弃中间的部署。
concurrency:
  group: rains3-deploy-main
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      S3_BUCKET: wutherin
      S3_ENDPOINT: https://cn-nb1.rains3.com

      AWS_DEFAULT_REGION: cn-nb1
      AWS_REGION: cn-nb1

      # AWS CLI 单个请求的自动重试
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: "10"

      # 提高新版 AWS CLI 对第三方 S3 服务的兼容性
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      # 不查询 EC2 元数据服务
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      # 1. 清理 GitHub Runner 中不需要的大型组件
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 开始清理 Runner 空间 ==="

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi

          echo "=== 当前磁盘空间 ==="
          df -h

      # 2. 拉取完整 Git 历史，以便比较 push 前后的真实变更
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # 3. 安装 WebP 转换工具
      - name: Install Required Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webp
          sudo apt-get clean

          echo "=== 工具版本 ==="
          cwebp -version
          aws --version

      # 4. 根据 Git 内容变化生成待上传文件清单
      - name: Detect Changed Files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FORCE_PATH: ${{ inputs.force_path }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import subprocess
          from pathlib import PurePosixPath

          event_name = os.environ.get("EVENT_NAME", "")
          before_sha = os.environ.get("BEFORE_SHA", "")
          after_sha = os.environ.get("AFTER_SHA", "") or "HEAD"
          force_path = os.environ.get("FORCE_PATH", "").strip()
          full_rebuild = (
              os.environ.get("FULL_REBUILD", "").strip().lower() == "true"
          )

          ZERO_SHA = "0" * 40

          def run_bytes(args):
              return subprocess.check_output(args)

          def commit_exists(ref):
              if not ref:
                  return False

              result = subprocess.run(
                  ["git", "cat-file", "-e", f"{ref}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return result.returncode == 0

          def normalize_path(raw_path):
              path = raw_path.replace("\\", "/")

              while path.startswith("./"):
                  path = path[2:]

              posix_path = PurePosixPath(path)

              if not path:
                  raise ValueError("文件路径不能为空")

              if posix_path.is_absolute():
                  raise ValueError(f"不允许绝对路径：{path}")

              if ".." in posix_path.parts:
                  raise ValueError(f"不允许路径穿越：{path}")

              return posix_path.as_posix()

          def is_excluded(path):
              return (
                  path == ".git"
                  or path.startswith(".git/")
                  or path == ".github"
                  or path.startswith(".github/")
              )

          def get_all_tracked_files():
              raw = run_bytes(["git", "ls-files", "-z"])

              files = set()

              for item in raw.split(b"\0"):
                  if not item:
                      continue

                  path = normalize_path(os.fsdecode(item))

                  if not is_excluded(path):
                      files.add(path)

              return files

          def get_changed_files(base, head):
              # --no-renames：
              # 重命名会被视为“删除旧文件 + 新增新文件”。
              # 这里只取新增、修改和类型变化后的新文件。
              raw = run_bytes([
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=AMT",
                  "--no-renames",
                  "-z",
                  base,
                  head,
                  "--",
              ])

              files = set()

              for item in raw.split(b"\0"):
                  if not item:
                      continue

                  path = normalize_path(os.fsdecode(item))

                  if not is_excluded(path):
                      files.add(path)

              return files

          mode = ""
          upload_files = set()

          # 手动指定某个文件，强制重新处理
          if force_path:
              path = normalize_path(force_path)

              if is_excluded(path):
                  raise SystemExit(f"该路径已被排除，无法上传：{path}")

              if not os.path.isfile(path):
                  raise SystemExit(f"指定文件不存在：{path}")

              upload_files = {path}
              mode = "force_path"

          # 手动执行全部重建
          elif full_rebuild:
              upload_files = get_all_tracked_files()
              mode = "full_rebuild"

          # 正常 push：比较 push 前后的所有变化
          elif (
              event_name == "push"
              and before_sha
              and before_sha != ZERO_SHA
              and commit_exists(before_sha)
          ):
              upload_files = get_changed_files(before_sha, after_sha)
              mode = f"push_diff:{before_sha[:8]}..{after_sha[:8]}"

          # 手动运行但未指定路径：默认处理最近一次提交
          elif commit_exists("HEAD^"):
              upload_files = get_changed_files("HEAD^", "HEAD")
              mode = "fallback:HEAD^..HEAD"

          # 没有可比较的父提交时，全量处理
          else:
              upload_files = get_all_tracked_files()
              mode = "fallback_full_rebuild"

          # 最后再次确认文件确实存在
          upload_files = {
              path
              for path in upload_files
              if os.path.isfile(path) and not is_excluded(path)
          }

          manifest = {
              "mode": mode,
              "files": sorted(upload_files),
          }

          with open(
              "deploy_manifest.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  manifest,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          print("=== Git 变更检测报告 ===")
          print(f"检测模式：{mode}")
          print(f"待处理文件数：{len(upload_files)}")

          for path in sorted(upload_files)[:30]:
              print(f"  {path}")

          if len(upload_files) > 30:
              print(f"  ……其余 {len(upload_files) - 30} 个文件省略")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"file_count={len(upload_files)}\n")
          PY

      # 5. 创建纯增量上传目录
      #
      # PNG：
      #   UI/test.png
      # 转换为：
      #   .deploy/UI/test.webp
      #
      # 其他变更文件保持原路径复制。
      - name: Build Deployment Payload
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path, PurePosixPath

          with open(
              "deploy_manifest.json",
              "r",
              encoding="utf-8",
          ) as file:
              manifest = json.load(file)

          source_files = manifest["files"]

          deploy_root = Path(".deploy")

          shutil.rmtree(deploy_root, ignore_errors=True)
          deploy_root.mkdir(parents=True, exist_ok=True)

          def get_remote_key(source_path):
              path = PurePosixPath(source_path)

              if path.suffix.lower() == ".png":
                  path = path.with_suffix(".webp")

              return path.as_posix()

          # 防止 foo.png 和 foo.webp 最终对应同一个远端 key
          remote_keys = {}

          for source_path in source_files:
              key = get_remote_key(source_path)

              if key in remote_keys:
                  raise RuntimeError(
                      "检测到远端路径冲突："
                      f"{remote_keys[key]} 和 {source_path} "
                      f"都会写入 {key}"
                  )

              remote_keys[key] = source_path

          def get_destination(key):
              parts = PurePosixPath(key).parts
              return deploy_root.joinpath(*parts)

          def build_one(source_path):
              source = Path(source_path)
              remote_key = get_remote_key(source_path)
              destination = get_destination(remote_key)

              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              if source.suffix.lower() == ".png":
                  subprocess.run(
                      [
                          "cwebp",
                          "-quiet",
                          "-q",
                          "85",
                          "-m",
                          "4",
                          str(source),
                          "-o",
                          str(destination),
                      ],
                      check=True,
                  )
              else:
                  shutil.copy2(source, destination)

              return remote_key

          completed = 0
          total = len(source_files)

          with ThreadPoolExecutor(max_workers=2) as executor:
              for remote_key in executor.map(build_one, source_files):
                  completed += 1

                  if completed % 50 == 0 or completed == total:
                      print(
                          f"处理进度：{completed}/{total}，"
                          f"最近完成：{remote_key}"
                      )

          payload_files = [
              path
              for path in deploy_root.rglob("*")
              if path.is_file()
          ]

          print("=== 构建结果 ===")
          print(f"源文件数量：{total}")
          print(f"上传文件数量：{len(payload_files)}")
          PY

      # 6. 检查本次增量包大小
      - name: Check Payload Size
        shell: bash
        run: |
          set -euo pipefail

          REAL_SIZE_KB=$(du -s .deploy | awk '{print $1}')
          REAL_SIZE_GB=$(awk \
            "BEGIN {printf \"%.3f\", $REAL_SIZE_KB/1024/1024}")

          FILE_COUNT=$(find .deploy -type f | wc -l)

          echo "=============================================="
          echo "本次增量文件数量：$FILE_COUNT"
          echo "本次增量包大小：$REAL_SIZE_GB GiB"
          echo "=============================================="

          # 18 GiB 安全限制
          if [ "$REAL_SIZE_KB" -gt 18874368 ]; then
            echo "【安全拦截】本次增量包超过 18 GiB。"
            echo "如确实需要全量上传，请确认 Runner 空间后调整限制。"
            exit 1
          fi

      # 7. 上传增量文件
      #
      # 使用 cp 而不是 sync：
      # cp 会明确上传 .deploy 中的每个文件，
      # 因此同路径、同大小但内容不同的文件仍会被覆盖。
      - name: Upload Changed Files to RainS3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SFTP_USERNAME }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail

          if ! find .deploy -type f -print -quit | grep -q .; then
            echo "本次没有需要上传的文件。"
            exit 0
          fi

          upload_once() {
            echo "上传非 WebP 文件……"

            aws s3 cp \
              .deploy/ \
              "s3://${S3_BUCKET}/" \
              --recursive \
              --exclude "*.webp" \
              --endpoint-url "$S3_ENDPOINT" \
              --cache-control \
                "no-cache,max-age=0,must-revalidate" \
              --only-show-errors \
              --no-progress \
              --cli-connect-timeout 60 \
              --cli-read-timeout 300 \
              || return 1

            echo "上传 WebP 文件……"

            aws s3 cp \
              .deploy/ \
              "s3://${S3_BUCKET}/" \
              --recursive \
              --exclude "*" \
              --include "*.webp" \
              --content-type "image/webp" \
              --endpoint-url "$S3_ENDPOINT" \
              --cache-control \
                "no-cache,max-age=0,must-revalidate" \
              --only-show-errors \
              --no-progress \
              --cli-connect-timeout 60 \
              --cli-read-timeout 300 \
              || return 1
          }

          for ATTEMPT in 1 2 3; do
            echo "=============================================="
            echo "开始第 ${ATTEMPT}/3 次完整上传尝试"
            echo "=============================================="

            if upload_once; then
              echo "RainS3 增量上传完成。"
              exit 0
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              WAIT_SECONDS=$((ATTEMPT * 30))

              echo "本轮上传失败。"
              echo "${WAIT_SECONDS} 秒后重新上传本次增量包……"

              sleep "$WAIT_SECONDS"
            fi
          done

          echo "连续三轮上传均失败。"
          exit 1
